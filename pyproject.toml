[project]
name = "mlflow-eval-workshop"
version = "0.1.0"
description = "ODSC AI West 2026: Evaluating LLM Applications with MLflow"
# NumPy 1.26 supports Python 3.10-3.12. Use 3.12 for the local workshop.
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{ name = "Debu Sinha", email = "debusinha2009@gmail.com" }]
readme = "README.md"

# Core dependencies for the West evaluation exercises.
# Third-party evaluator frameworks are optional advanced material.
dependencies = [
    "mlflow[genai]==3.16.0",
    "scikit-learn>=1.4",
    "numpy>=1.26,<2",       # databricks-connect in the runtime requires <2
    "protobuf>=5.26.1,<6",  # retain the tested Databricks runtime constraint
    "openai>=2.54",  # refreshable bearer-token callable for Databricks unified auth
]

[project.optional-dependencies]
ecosystem = [
    # MLflow 3.16 still constructs the legacy *Evaluator Phoenix classes.
    # Phoenix 3.x removed them. Importing the MLflow wrapper alone misses this.
    "arize-phoenix-evals>=2.11,<3.0",
    "trulens==2.14.0",
    "trulens-providers-litellm==2.14.0",
    "litellm>=1.82.6,!=1.82.7,!=1.82.8",
    "nltk>=3.9",
]
databricks = ["databricks-agents>=0.14"]
local = ["jupytext>=1.16"]
all = [
    "mlflow-eval-workshop[ecosystem,databricks,local]",
]

[tool.uv]
# Preserve the explicit exclusions even when Databricks pulls LiteLLM transitively.
constraint-dependencies = ["litellm!=1.82.7,!=1.82.8"]
